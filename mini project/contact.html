<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - SHA Events</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="container nav-container">
      <a class="logo" href="index.html">
        <img src="logo.png" alt="SHA Events Logo" class="logo-img">
        <span>SHA EVENTS</span>
      </a>
      <nav class="site-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="team.html">Team</a></li>
          <li><a href="testimonials.html">Testimonials</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- CONTACT FORM SECTION -->
  <section class="contact-section">
    <div class="container">
      <h2 class="section-title">Get in Touch With Us</h2>
      <p class="contact-intro">
        We would love to plan your next event! Fill in your details below and we will contact you shortly.
      </p>

      <!-- EmailJS Form -->
      <form id="contact-form" class="contact-form">
         <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="from_name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="from_email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
        </div>

        <div class="form-group">
          <label for="eventType">Event Type</label>
          <select id="eventType" name="eventType" required>
            <option value="">Select an event</option>
            <option value="Wedding">Wedding</option>
            <option value="Birthday">Birthday</option>
            <option value="Corporate Event">Corporate Event</option>
            <option value="Special Moment">Special Moment</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Event Details</label>
          <textarea id="message" name="message" rows="5" placeholder="Tell us about your event..." required></textarea>
        </div>

        <button type="submit" class="btn primary">Submit</button>
      </form>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container">
      <p>© 2025 SHA Events. All rights reserved.</p>
    </div>
  </footer>

  <!-- EmailJS Integration -->
  <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
  <script>
    (function(){
      emailjs.init("2ttObvC9Rg9Lrcvt7"); // 🔑 Replace with your EmailJS Public Key
    })();

    document.getElementById("contact-form").addEventListener("submit", function(e){
      e.preventDefault();

      emailjs.sendForm("service_012", "template_baqs6tm", this)
        .then(() => {
          alert("✅ Your message has been sent successfully!");
          this.reset();
        }, (error) => {
          alert("❌ Oops! Something went wrong. Please try again.");
          console.error("EmailJS Error:", error);
        });
    });
  </script>
</body>
</html>
